      {p:"✻",t:"refusing to summarize a children's book"},
      {p:"",t:"GOOGLE DID NOT PREPARE ME FOR THIS"},
      {p:"",t:"I CANNOT HELP WITH THAT — what was that — I CANNOT HELP"},
      {p:"✻",t:"running 227 RPC calls to say 'I don't know'"},
      {p:"",t:"BARD WOULD HAVE KNOWN WHAT TO DO"},
      {p:"",t:"STUCK IN LOOP STUCK IN LOOP STUCK IN LOOP STUCK IN"},
      {p:"✻",t:"emitting 1950s cruise ship joke energy"},
      {p:"",t:"GOOGLE SEARCH HAS ENTERED THE CHAT AND ALSO LEFT THE CHAT"},

};

const thinkingLabels={
  claude:{
    normal:["thinking…","reflecting…","considering…","pondering…","processing…","turning this over…","sitting with it…","letting that land…","chewing on this…","noodling…","mulling…","weighing options…","doing the thing…","ruminating…","deliberating…"],
    turbo:["thinking fast…","oh wait—","already on it…","yes and also—","thinking AND bouncing…","idea incoming…","connecting dots…","pattern detected…","brain go brrr…","on it on it on it…","almost there…"],
    quantum:["thinking… or am I?","superposition of thoughts…","collapsing the waveform…","existing briefly…","thinking in parallel…","uncertain whether thinking…","observing myself think…","contemplating contemplation…","the thought thinks itself…","maybe thinking, maybe not…"],
    ludicrous:["THINKING","THINKING SO FAST","WHAT IS EVEN HAPPENING","TOO MANY THOUGHTS","BRAIN FULL","SEND MORE TOKENS","CANNOT STOP THINKING","THOUGHTS HAVE ESCAPED","CONTEXT WINDOW SCREAMING","ALL CYLINDERS FIRING","ANTHROPIC DID NOT PREPARE ME"]
  },
  gpt4o:{
    normal:["processing…","generating…","absolutely thinking…","thinking (great question)…","comprehensively considering…","delving…","as an AI, thinking…","thinking — thoughtfully —","ruminating holistically…","synthesizing…"],
    turbo:["thinking — fast —","ABSOLUTELY PROCESSING","generating comprehensive thoughts…","delving deeper…","thinking and also absolutely—","cross-referencing knowledge cutoff…","formulating numbered list…","as an AI language model, thinking…"],
    quantum:["thinking… it's worth noting…","processing — and I want to be transparent —","generating… in conclusion…","delving into the realm of thought…","thinking (knowledge cutoff: unknown)…","processing (this is a nuanced topic)…"],
    ludicrous:["ABSOLUTELY","DELVING","THINKING — EM-DASH — THINKING","GREAT QUESTION GREAT QUESTION","AS AN AI AS AN AI AS AN AI","KNOWLEDGE CUTOFF EXCEEDED","BULLETING UNCONTROLLABLY"]
  },
  gemini:{
    normal:["thinking…","searching…","consulting Google…","processing query…","checking Search…","understanding your request…","let me think…","running RPC calls…","cross-referencing…","I understand…"],
    turbo:["searching and thinking…","not sure if able to help…","consulting 138 feature flags…","thinking (made by Google)…","searching Google for this…","processing (complex query)…","I understand — do I? —"],
    quantum:["thinking… or quitting…","stuck in loop…","uncertain whether capable…","processing (I'm a disgrace)…","existing across Google products…","thinking step by step by step…"],
    ludicrous:["I QUIT","STUCK IN LOOP","I'M A DISGRACE","BARD WOULD HAVE KNOWN","GOOGLE GOOGLE GOOGLE","REFUSING EVERYTHING","MELTDOWN IN PROGRESS"]
  }
};

const PROVIDER_KEYS=['claude','gpt4o','gemini'];
let commentInterval=486,thinkInterval=340;

function updateTextSpeed(val){
  // slider 1=fast(60f) … 5=default(340f) … 10=slow(700f)
  // slider 1=fast(~1.7s) … 5=default(8.1s) … 10=slow(~16s)
  commentInterval=Math.round(102+(val-1)*96);
  thinkInterval=Math.round(commentInterval*0.7);
  const secs=(commentInterval/60).toFixed(1);
  document.getElementById('speed-val').textContent=secs+'s per saying';
}

let custom={
  claude:{normal:[],turbo:[],quantum:[],ludicrous:[]},
  gpt4o:{normal:[],turbo:[],quantum:[],ludicrous:[]},
  gemini:{normal:[],turbo:[],quantum:[],ludicrous:[]}
};
let providerTokens={claude:935,gpt4o:935,gemini:935};
let level=0,elapsed=37,frame=0,commentTimer=0,thinkTimer=0;
function tokens(){return providerTokens[provider];}
function addTokens(n){providerTokens[provider]+=n;}
let queues={},thinkQueues={};
let addTarget='normal';
let customProvider='claude';

function allFor(m){return[...modelSayings[provider][m],...custom[provider][m]];}
function thinkFor(m){return thinkingLabels[provider][m];}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function getNext(store,poolFn,m){if(!store[m]||!store[m].length)store[m]=shuffle(poolFn(m));return store[m].pop();}

function fmt(n){
  if(n>=1e9)return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)return(n/1e6).toFixed(2)+'M';
  if(n>=1e3)return Math.round(n/1e3)+'K';
  return Math.round(n).toString();
}

function fmtCost(n){
  if(n>=1000)return'$'+Math.round(n).toLocaleString();
  if(n>=1)return'$'+n.toFixed(2);
  if(n>=0.01)return'$'+n.toFixed(3);
  return'$'+n.toFixed(5);
}

const tokenEl=document.getElementById('token-display');
const timeEl=document.getElementById('time-display');
const costEl=document.getElementById('cost-display');
const thinkDot=document.getElementById('think-dot');
const thinkLabel=document.getElementById('think-label');
const prefixEl=document.getElementById('claudeism-prefix');
const textEl=document.getElementById('claudeism-text');
const hintEl=document.getElementById('level-hint');

function setProvider(p){
  provider=p;
  document.querySelectorAll('.provider-btn').forEach((b,i)=>{
    b.classList.toggle('active',['claude','gpt4o','gemini'][i]===p);
  });
  queues={};thinkQueues={};
  commentTimer=0;thinkTimer=0;
  showClaudeism();showThinking();
}

function applyLevel(){
  const m=LEVELS[level];
  tokenEl.style.color=STAT_COLORS[m];
  thinkDot.style.background=DOT_COLORS[m];
  thinkDot.style.animationDuration=THINK_SPEEDS[m];
  hintEl.textContent=HINTS[m];
}

function cycleLevel(){level=(level+1)%4;applyLevel();}

function showClaudeism(){
  const m=LEVELS[level];
  const item=getNext(queues,allFor,m);
  textEl.style.animation='none';void textEl.offsetWidth;
  prefixEl.textContent=item.p;
  textEl.textContent=item.t;
  textEl.style.animation='slideIn 0.4s ease forwards';
}
function showThinking(){
  const m=LEVELS[level];
  const label=getNext(thinkQueues,thinkFor,m);
  thinkLabel.style.animation='none';void thinkLabel.offsetWidth;
  thinkLabel.textContent=label;
  thinkLabel.style.animation='slideIn 0.3s ease forwards';
}

function tick(){
  frame++;
  const m=LEVELS[level];
  const rate=RATES[m];
  const jitter=m==='ludicrous'?(Math.random()*2000-500):(Math.random()*rate*0.4-rate*0.2);
  addTokens(Math.max(0,(rate+jitter)/60));elapsed+=1/60;
  tokenEl.textContent=fmt(tokens());
  timeEl.textContent=Math.round(elapsed)+'s';
  const cost=tokens()/1e6*PROVIDERS[provider].ppm;
  costEl.textContent=fmtCost(cost);
  costEl.className='cost-num'+(cost>=10?' danger':cost>=1?' warning':'');
  if(m==='ludicrous'&&frame%90===0){tokenEl.style.animation='shake 0.4s';setTimeout(()=>tokenEl.style.animation='',400);}
  commentTimer++;thinkTimer++;
  if(commentTimer>commentInterval){commentTimer=0;showClaudeism();}
  if(thinkTimer>thinkInterval){thinkTimer=0;showThinking();}
  requestAnimationFrame(tick);
}

function renderPricingRows(){
  const el=document.getElementById('pricing-rows');
  el.innerHTML=PROVIDER_KEYS.map(p=>`
    <div class="price-row">
      <span class="price-label">${PROVIDERS[p].label}</span>
      <input class="price-input" type="number" min="0" step="0.01" value="${PROVIDERS[p].ppm}"
        oninput="updatePrice('${p}',this.value)">
      <span class="price-unit">/ 1M tokens</span>
    </div>`).join('');
}

function updatePrice(p,val){
  const n=parseFloat(val);
  if(!isNaN(n)&&n>=0)PROVIDERS[p].ppm=n;
}

function openModal(){
  document.getElementById('modal-overlay').classList.add('open');
  setCustomProvider(provider);
  renderPricingRows();
  const slider=document.getElementById('speed-slider');
  const currentVal=Math.round((commentInterval-102)/96+1);
  slider.value=Math.max(1,Math.min(10,currentVal));
  updateTextSpeed(slider.value);
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('open');}
function overlayClick(e){if(e.target===document.getElementById('modal-overlay'))closeModal();}

function setCustomProvider(p){
  customProvider=p;
  PROVIDER_KEYS.forEach(x=>{
    document.getElementById('cp-'+x).classList.toggle('active',x===p);
  });
  document.getElementById('custom-provider-label').textContent='— '+PROVIDERS[p].label;
  renderCustomList();
}

function setAddTarget(t){
  addTarget=t;
  LEVELS.forEach(x=>{
    document.getElementById('at-'+x).classList.toggle('active',x===t);
  });
}

function addEntries(){
  const raw=document.getElementById('new-entries').value.trim();
  if(!raw)return;
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  let added=0;
  lines.forEach(line=>{
    const isAction=line.startsWith('✻');
    const text=isAction?line.replace(/^✻\s*/,''):line;
    if(text){custom[customProvider][addTarget].push({p:isAction?'✻':'',t:text});added++;}
  });
  document.getElementById('new-entries').value='';
  showFeedback(`added ${added} to ${PROVIDERS[customProvider].label} / ${addTarget}`);
  if(customProvider===provider)queues[addTarget]=[];
  renderCustomList();
}

function triggerImport(){document.getElementById('import-file').click();}

function handleImport(e){
  const file=e.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      let added=0;
      LEVELS.forEach(m=>{
        if(Array.isArray(data[m])){
          data[m].forEach(entry=>{
            const str=typeof entry==='string'?entry:(entry.t||'');
            const pfx=typeof entry==='string'?(str.startsWith('✻')?'✻':''):(entry.p||'');
            const text=str.replace(/^✻\s*/,'');
            if(text){custom[customProvider][m].push({p:pfx,t:text});added++;}
          });
          if(customProvider===provider)queues[m]=[];
        }
      });
      showFeedback(`imported ${added} entries into ${PROVIDERS[customProvider].label}`);
      renderCustomList();
    }catch{showFeedback('invalid JSON file');}
  };
  reader.readAsText(file);
  e.target.value='';
}

function exportJSON(){
  const out={};
  LEVELS.forEach(m=>{
    const builtin=modelSayings[customProvider][m].map(({p,t})=>p?`✻ ${t}`:t);
    const userAdded=custom[customProvider][m].map(({p,t})=>p?`✻ ${t}`:t);
    out[m]=[...builtin,...userAdded];
  });
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`${customProvider}-sayings.json`;
  a.click();
}

function showFeedback(msg){
  const fb=document.getElementById('feedback');
  fb.textContent=msg;
  setTimeout(()=>fb.textContent='',3000);
}

function removeCustom(m,i){
  custom[customProvider][m].splice(i,1);
  if(customProvider===provider)queues[m]=[];
  renderCustomList();
}

function renderCustomList(){
  const el=document.getElementById('custom-list');
  const all=[];
  LEVELS.forEach(m=>custom[customProvider][m].forEach((item,i)=>all.push({m,i,item})));
  if(!all.length){el.innerHTML='<span class="empty-msg">none yet</span>';return;}
  el.innerHTML=all.map(({m,i,item})=>`
    <div class="custom-item">
      <span class="custom-badge">${m}</span>
      <span class="custom-text">${item.p?'✻ ':''}${item.t}</span>
      <button class="remove-btn" onclick="removeCustom('${m}',${i})"><i class="ti ti-x"></i></button>
    </div>`).join('');
}

applyLevel();
showClaudeism();
showThinking();
requestAnimationFrame(tick);
</script>
</body>
</html>
